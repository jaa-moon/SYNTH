[build-system]
requires = ["setuptools>=70.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "synth"
version = "0.1.1"
description = "AI Content Authenticator & OCR Engine — detect AI-generated text with statistical analysis."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Khushaal", email = "khushaal@example.com" },
]
keywords = ["ai", "authenticator", "ocr", "cli", "nlp", "perplexity", "content-detection"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]

dependencies = [
    "typer>=0.12,<1",
    "rich>=13,<16",
    "easyocr>=1.7,<2",
    "opencv-python-headless>=4.9,<5",
    "torch>=2.2,<3",
    "transformers>=4.40,<6",
    "python-dotenv>=1.0,<2",
    "httpx>=0.27,<1",
    "PyMuPDF>=1.24,<2",
    "python-docx>=1.1,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[project.scripts]
synth = "synth.cli.main:app"

[project.urls]
Homepage = "https://github.com/khushaal/synth"
Repository = "https://github.com/khushaal/synth"
Issues = "https://github.com/khushaal/synth/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
